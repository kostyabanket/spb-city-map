<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--forest:#124f49;--forest-dark:#163d3a;--cream:#f9f7f1;--paper:#fff;--ink:#1d343b;--muted:#647779;--line:#dfe7e1;--warm:#ba7448;--shadow:0 20px 70px #0a302d29}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:#d8e7e2}
button,input{font:inherit}
button{cursor:pointer}
a{color:var(--forest);text-underline-offset:3px}
#map{position:absolute;inset:0;z-index:0;background:#d9e9e2}
.leaflet-container{font-family:Manrope,sans-serif}
.leaflet-control-attribution{font-size:10px!important}
.shell{position:relative;height:100dvh;min-height:500px;overflow:hidden}
.head{position:absolute;top:20px;left:20px;z-index:700;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;padding:11px 16px;background:#fffefa;border:1px solid #ffffffea;border-radius:17px;box-shadow:var(--shadow)}
.brandmark{width:40px;height:40px;border-radius:12px;background:var(--forest);display:grid;place-items:center;color:white;font-size:25px;font-family:Georgia}
.brand strong{font-size:19px;letter-spacing:-1px;display:block;line-height:1.2}.brand small{font-size:10px;letter-spacing:.45px;color:var(--muted)}
.status{font-weight:800;text-transform:uppercase;letter-spacing:1.2px;font-size:9px;color:#386860;background:#e9f3eb;border:1px solid #fff9;padding:10px 12px;border-radius:99px;box-shadow:0 4px 20px #123c2e13}
.locator{position:absolute;z-index:650;top:104px;left:20px;width:308px;background:#fffefa;border:1px solid #ffffffdd;border-radius:18px;box-shadow:var(--shadow);padding:16px;max-height:calc(100dvh - 125px);display:flex;flex-direction:column}
.locator-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{text-transform:uppercase;letter-spacing:1.55px;color:var(--forest);font-size:9px;font-weight:800}
.locator h1{font-family:Prata,Georgia,serif;font-size:19px;font-weight:400;line-height:1.3;letter-spacing:-.4px;margin:8px 0 13px}
.search{display:flex;border:1px solid var(--line);background:#f7f8f4;border-radius:12px;align-items:center;padding:0 12px;gap:8px}
.search input{background:transparent;border:0;outline:0;padding:12px 0;min-width:0;width:100%;font-size:11px;color:var(--ink)}
.place-list{overflow:auto;margin-top:11px;scrollbar-color:#c1d3cb transparent}
.place-item{width:100%;display:flex;text-align:left;gap:11px;align-items:center;border:1px solid transparent;background:transparent;border-radius:12px;padding:7px;transition:.2s}
.place-item:hover,.place-item.active{background:#edf5f0;border-color:#d8e8df}
.place-item img{width:57px;height:56px;object-fit:cover;border-radius:9px;flex-shrink:0;background:#dde9e2}
.place-item .name{font-size:11px;font-weight:800;display:block}.place-item .address{font-size:10px;color:var(--muted);line-height:1.4;display:block;margin-top:4px}
.label-small{font-size:9px;color:var(--forest);font-weight:800}
.empty{font-size:12px;color:var(--muted);padding:15px}
.count{font-size:10px;color:var(--muted);white-space:nowrap}
.hide-list{border:0;background:#e9f2ec;color:var(--forest);font-size:10px;font-weight:800;padding:7px 9px;border-radius:8px}
.locator.collapsed{width:auto;padding:10px}
.locator.collapsed h1,.locator.collapsed .search,.locator.collapsed .place-list,.locator.collapsed .count{display:none}
.card{position:absolute;top:20px;right:20px;bottom:20px;z-index:680;width:min(405px,calc(100vw - 40px));background:var(--paper);border:1px solid #ffffffd9;box-shadow:var(--shadow);border-radius:22px;overflow:auto;overscroll-behavior:contain}
.card:not(.visible){display:none}
.hero{height:210px;position:relative;background:#cddbd3}
.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:60% 0 0;background:linear-gradient(transparent,#102f3290);pointer-events:none}
.hero-meta{position:absolute;z-index:2;bottom:13px;left:19px;color:white;font-size:10px;font-weight:800}
.close-card{position:absolute;right:12px;top:12px;z-index:3;border:0;width:34px;height:34px;border-radius:50%;background:#ffffffef;font-size:24px;line-height:1;color:var(--ink)}
.card-inner{padding:21px}
.small-tag{display:inline-flex;gap:7px;align-items:center;color:var(--forest);font-weight:800;letter-spacing:1.5px;font-size:9px;text-transform:uppercase}
.card h2{font-family:Prata,Georgia,serif;font-size:25px;line-height:1.35;letter-spacing:-.6px;font-weight:400;margin:10px 0 6px}
.card .address{font-size:11px;color:var(--muted);line-height:1.6}
.card .intro{font-size:12px;line-height:1.75;margin:15px 0 18px;color:#40575a}
.section-title{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 0 10px}
details{border:1px solid var(--line);border-radius:13px;margin:8px 0;background:white;overflow:hidden}
details[open]{background:#fcfdfa;border-color:#c9dfd4}
summary{list-style:none;padding:14px 15px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;cursor:pointer;user-select:none}
summary::-webkit-details-marker{display:none}
.icon-circle{height:29px;width:29px;flex-shrink:0;border-radius:9px;background:#e8f3ed;color:var(--forest);display:grid;place-items:center;font-size:15px}
.chev{margin-left:auto;color:#7e968e;font-size:17px;transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.detail-body{padding:0 16px 16px 54px;color:#496066;font-size:11px;line-height:1.8}
.detail-body p{margin:6px 0 11px}
.detail-body b{color:#233d3f}
.source-line{border-top:1px solid #e5ebe6;padding:11px 0 0;margin-top:11px;font-size:10px}
.person{border-bottom:1px solid var(--line);padding:9px 0}.person:last-child{border-bottom:none}
.person b{display:block;font-size:11px}.person small{display:block;font-size:10px;color:var(--muted);line-height:1.65}
.badge{display:inline-block;border-radius:6px;background:#eef2ed;padding:3px 6px;color:#61716e;font-size:9px;font-weight:700}
.muted{color:var(--muted)}
.card-foot{border-top:1px solid var(--line);margin-top:16px;padding-top:13px;font-size:10px;color:var(--muted);line-height:1.7}
.media-sm{height:135px;width:100%;object-fit:cover;border-radius:10px}
.map-note{position:absolute;z-index:550;bottom:20px;left:20px;background:#fffffff0;border:1px solid #fff;padding:9px 12px;border-radius:10px;font-size:10px;color:#54736c;box-shadow:0 8px 30px #143d3520}
.marker{display:flex;align-items:center;justify-content:center;border:3px solid white;border-radius:15px;background:var(--forest);color:white;font-size:12px;font-weight:800;box-shadow:0 5px 16px #163e3e40;transform:rotate(-7deg)}
.marker.selected{background:var(--warm);transform:rotate(0) scale(1.1)}
.map-fallback{position:absolute;inset:0;background:#dfebe4;z-index:1}
.map-fallback svg{width:100%;height:100%}
.map-fallback .notice{position:absolute;bottom:20px;left:20px;background:#fffffff0;padding:9px 11px;border-radius:10px;font-size:10px;color:#486c65}
.map-fallback .f-pin{position:absolute;transform:translate(-50%,-50%);width:35px;height:35px;background:var(--forest);border:3px solid white;border-radius:50%;color:white;font-weight:800}
.map-fallback .f-pin.selected{background:var(--warm)}
.map-fallback[hidden]{display:none}
@media(max-width:850px){.card{width:355px}.status{display:none}.locator{width:280px}}
@media(max-width:680px){.head{top:10px;left:10px}.brand{padding:8px 10px}.brandmark{width:31px;height:31px;font-size:20px}.brand strong{font-size:16px}.brand small{font-size:9px}.locator{top:75px;left:10px;width:min(250px,calc(100vw - 20px));padding:11px;max-height:190px}.locator h1{font-size:15px;margin:5px 0}.locator .place-list{max-height:85px}.place-item img{height:38px;width:43px}.place-item .address{display:none}.card{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:58dvh;border-radius:17px}.hero{height:100px}.card-inner{padding:14px}.card h2{font-size:20px}.card .intro{margin:8px 0 10px;font-size:11px}.detail-body{padding-left:14px}.map-note{display:none}}
</style>
</head>

<script>
"use strict";
const data=window.SPB_MVP_DATA;
const placeById=new Map(data.places.map(p=>[p.id,p]));
let selectedId="SPB-PET-0001",leafletMap=null,mapReady=false;
const markers=new Map();
function safe(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function external(url,label){try{const u=new URL(url);if(u.protocol!=="https:")return safe(label);return '<a href="'+safe(u.href)+'" target="_blank" rel="noopener noreferrer">'+safe(label)+'</a>'}catch{return safe(label)}}
function imageTag(p,klass){return '<img class="'+(klass||'')+'" src="'+safe(p.photo)+'" loading="lazy" alt="'+safe(p.name)+'" onerror="this.hidden=true">'}
function renderList(){const query=document.getElementById("search").value.trim().toLowerCase();const places=data.places.filter(p=>(p.name+" "+p.address).toLowerCase().includes(query));document.getElementById("count").textContent=places.length+" из "+data.places.length+" мест";document.getElementById("placeList").innerHTML=places.map(p=>'<button class="place-item '+(p.id===selectedId?'active':'')+'" type="button" data-place="'+safe(p.id)+'">'+imageTag(p)+'<span><span class="name">'+safe(p.name)+'</span><span class="address">'+safe(p.address)+'</span></span></button>').join("")||'<div class="empty">Мест не найдено</div>';document.querySelectorAll("[data-place]").forEach(btn=>btn.addEventListener("click",()=>select(btn.dataset.place)))}
function makePeople(p){const entries=data.people.filter(x=>x.place_id===p.id);if(!entries.length)return '<p>Подтверждённых адресных связей пока нет.</p>';return '<p class="muted">Исследовательские кандидаты. Первичные архивные документы ещё проверяются.</p>'+entries.map(x=>'<div class="person"><b>'+safe(x.person_name)+'</b><small>'+safe(x.relation_type==="RESIDED_AT"?"Проживание":x.relation_type==="ACQUIRED_PARCEL"?"Покупка участка":"Владение зданием")+(x.apartment?" · кв. "+safe(x.apartment):"")+'<br>'+safe(x.historical_address)+'<br>'+(x.valid_from?"с "+safe(x.valid_from)+" ":"")+(x.valid_to?"по "+safe(x.valid_to):"")+'</small><small>'+safe(x.reliability_note)+'</small>'+external(x.source_url,"Источник")+'</div>').join("")}
function cardHtml(p){
return '<div class="hero">'+imageTag(p)+'<div class="hero-meta">Фотография · '+safe(p.photoDate||"дата не установлена")+'</div><button class="close-card" type="button" aria-label="Закрыть карточку" id="closeCard">×</button></div>'+
'<div class="card-inner"><div class="small-tag">'+safe(p.category)+' · '+safe(p.id)+'</div><h2>'+safe(p.name)+'</h2><div class="address">⌖ '+safe(p.address)+'</div><p class="intro">'+safe(p.why||p.description)+'</p>'+
'<div class="section-title">Открыть подробнее</div>'+
'<details><summary><span class="icon-circle">⌂</span>История и особенности<span class="chev">⌄</span></summary><div class="detail-body"><p>'+safe(p.description)+'</p><p><b>Что заметить:</b> '+safe(p.look)+'</p><p class="muted">Границы дворов и законность входа требуют отдельной проверки.</p></div></details>'+
'<details><summary><span class="icon-circle">♧</span>Люди и адреса <span class="badge">'+data.people.filter(x=>x.place_id===p.id).length+'</span><span class="chev">⌄</span></summary><div class="detail-body">'+makePeople(p)+'</div></details>'+
'<details><summary><span class="icon-circle">▧</span>Фотографии и источники<span class="chev">⌄</span></summary><div class="detail-body">'+imageTag(p,"media-sm")+'<p><b>Автор:</b> '+safe(p.author)+' · '+safe(p.photoDate)+'</p><p><b>Лицензия:</b> '+safe(p.license)+' · '+external(p.licenseUrl,"условия")+'</p><p>'+external(p.source,"Открыть оригинал фотографии")+'</p><div class="source-line">'+(p.links||[]).map(l=>'<div>'+external(l.url,l.label)+'</div>').join("")+'</div></div></details>'+
'<div class="card-foot">Материалы показаны для тестирования интерфейса. Исторические сведения отмечены как исследовательские кандидаты. Источники и лицензии доступны внутри карточки.</div></div>';
}
function select(id,fly=true){const p=placeById.get(id);if(!p)return;selectedId=id;const card=document.getElementById("card");card.innerHTML=cardHtml(p);card.classList.add("visible");card.scrollTop=0;document.getElementById("closeCard").addEventListener("click",()=>card.classList.remove("visible"));renderList();document.querySelectorAll(".f-pin").forEach(el=>el.classList.toggle("selected",el.dataset.id===id));for(const [pid,m] of markers){m.setIcon(createIcon(pid,pid===id));}if(mapReady&&fly)leafletMap.flyTo([p.coords[1],p.coords[0]],15,{duration:.55});}
function createIcon(id,selected){const i=data.places.findIndex(p=>p.id===id)+1;return L.divIcon({html:'<div class="marker '+(selected?'selected':'')+'" style="width:39px;height:39px">'+i+'</div>',className:"",iconSize:[40,40],iconAnchor:[20,20]});}
function showFallback(){const box=document.getElementById("fallback");box.hidden=false;const xs=data.places.map(p=>p.coords[0]),ys=data.places.map(p=>p.coords[1]);const xmin=Math.min(...xs)-.008,xmax=Math.max(...xs)+.006,ymin=Math.min(...ys)-.005,ymax=Math.max(...ys)+.004;document.getElementById("fallbackPins").innerHTML=data.places.map((p,i)=>'<button type="button" class="f-pin" data-id="'+safe(p.id)+'" style="left:'+((p.coords[0]-xmin)/(xmax-xmin)*74+10)+'%;top:'+((ymax-p.coords[1])/(ymax-ymin)*72+13)+'%">'+(i+1)+'</button>').join("");document.querySelectorAll(".f-pin").forEach(btn=>btn.addEventListener("click",()=>select(btn.dataset.id,false)))}
function initMap(){if(!window.L){showFallback();return;}try{leafletMap=L.map("map",{zoomControl:false}).setView([59.9606,30.307],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(leafletMap);L.control.zoom({position:"bottomleft"}).addTo(leafletMap);data.places.forEach(p=>{const marker=L.marker([p.coords[1],p.coords[0]],{icon:createIcon(p.id,p.id===selectedId)}).addTo(leafletMap).on("click",()=>select(p.id,false));marker.bindTooltip(p.name);markers.set(p.id,marker)});mapReady=true;document.getElementById("fallback").hidden=true;select(selectedId,false);}catch(e){showFallback();}}
document.getElementById("search").addEventListener("input",renderList);
document.getElementById("toggleList").addEventListener("click",()=>{const box=document.getElementById("locator");box.classList.toggle("collapsed");document.getElementById("toggleList").textContent=box.classList.contains("collapsed")?"Места · 4":"Свернуть"});
showFallback();select(selectedId,false);
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" onload="initMap()" onerror="showFallback()"></script>
</body></html>
