name: Sheet to GeoJSON preview
on:
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only Google Sheets client
        run: python -m pip install google-auth requests
      - name: Read private canonical Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python tools/fetch_sheet.py --output /tmp/spb-map-sheet.csv
      - name: Validate and preview differences (no publication)
        run: python tools/sheet_to_geojson.py --csv /tmp/spb-map-sheet.csv --check
