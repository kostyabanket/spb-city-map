<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#124f49">
<meta name="description" content="SPB MAP — исторические места Петербурга на одной карте. Фотографии, истории и источники в карточках мест.">
<title>SPB MAP — Петербург через карту</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Prata&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="./style.css" rel="stylesheet">
</head>
<body>
<main id="main">
 <div id="map" aria-label="Карта исторических мест Петербурга"></div>
 <header class="brand" aria-label="SPB MAP">
   <span class="brand-symbol" aria-hidden="true">⌖</span>
   <span><strong>SPB MAP</strong><small>Петербург через карту</small></span>
 </header>
 <section class="search-panel" id="search-panel" aria-label="Поиск мест">
   <button id="search-toggle" class="search-toggle" aria-expanded="false" aria-controls="search-drawer" type="button"><span aria-hidden="true">⌕</span> Найти место <span class="search-count" id="search-count">4</span> <span aria-hidden="true" class="chevron">⌄</span></button>
   <div id="search-drawer" hidden>
     <label class="sr-only" for="search">Поиск по названию, адресу и описанию</label>
     <input id="search" type="search" placeholder="Название или адрес..." autocomplete="off">
     <div id="filters" aria-label="Категории"></div>
     <div id="results-list" aria-live="polite"></div>
     <p class="search-note">Выберите место — откроется карточка на этой же карте.</p>
   </div>
 </section>
 <article id="detail" class="detail" aria-label="Карточка объекта" hidden></article>
 <div class="map-caption">Петроградская сторона · Пилот · <span id="places-count">4 места</span></div>
</main>
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<script src="./app.js"></script>
</body>
</html>
